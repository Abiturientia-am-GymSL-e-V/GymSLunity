version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    # Minor and patch updates arrive as one PR; major updates get their own
    # PR so a breaking change does not block the rest.
    groups:
      php-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    # Minor and patch updates arrive as one PR; major updates get their own
    # PR so a breaking change does not block the rest.
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Node is pinned to 24 (engines), so @types/node must stay on 24.x.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vite is an npm alias of @voidzero-dev/vite-plus-core and must match
      # vite-plus exactly. Dependabot cannot update the alias, so its PRs
      # always fail; bump vite-plus and both vite entries by hand instead.
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      - dependency-name: "@voidzero-dev/vite-plus-core"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # One PR for all action updates instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
