name: website

# Veröffentlicht die Produktwebsite aus website/ über GitHub Pages unter
# gymslunity.de. In den Repository-Einstellungen muss unter Pages als Quelle
# "GitHub Actions" gewählt sein. Die angezeigte Version stammt aus VERSION.
on:
  push:
    branches:
      - main
    paths:
      - website/**
      - VERSION
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare site
        run: |
          cp -R website _site
          version=$(tr -d '[:space:]' < VERSION)
          sed -i -E "s|(<span data-version>)[^<]*(</span>)|\1${version}\2|g" _site/*.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
