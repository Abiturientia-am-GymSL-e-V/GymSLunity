name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # composer ci:check also runs the tests on MariaDB (test:mariadb). 10.11 is
    # the oldest maintained LTS and still common on shared hosting.
    services:
      mariadb:
        image: mariadb@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab # 10.11
        env:
          MARIADB_DATABASE: gymslunity_testing
          MARIADB_USER: gymslunity_testing
          MARIADB_PASSWORD: testing
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Application
        run: |
          composer setup
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing

      - name: Run CI Checks
        run: composer ci:check

  # Public demo of the current main branch, only after green checks.
  demo:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEMO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # A dispatched run gets the secrets of the "demo" environment, a called
      # workflow does not. Unlike other events, workflow_dispatch also starts
      # a run when it is created with GITHUB_TOKEN.
      - name: Start demo deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run demo-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f target=next
