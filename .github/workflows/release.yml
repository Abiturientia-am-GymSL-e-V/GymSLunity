name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # For test:mariadb in composer ci:check, as in tests.yml.
    services:
      mariadb:
        image: mariadb@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab # 10.11
        env:
          MARIADB_DATABASE: gymslunity_testing
          MARIADB_USER: gymslunity_testing
          MARIADB_PASSWORD: testing
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag, VERSION and release notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu VERSION ($version)." >&2
            exit 1
          fi
          test -s "docs/releases/$GITHUB_REF_NAME.md" || {
            echo "Release-Notizen docs/releases/$GITHUB_REF_NAME.md fehlen." >&2
            exit 1
          }

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run CI checks
        run: |
          composer setup
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing
          composer ci:check

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Signed build provenance (Sigstore) for the release files.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, xml, zip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Build release archive
        run: scripts/build-release.sh

      # The installer of this release loads install-common.sh from this tag
      # and installs this release, never a newer state of main.
      - name: Pin the installer to this release
        run: |
          sed "s/^readonly installer_ref=main\$/readonly installer_ref=$GITHUB_REF_NAME/" \
            scripts/install-server.sh > dist/install-server.sh
          grep -qx "readonly installer_ref=$GITHUB_REF_NAME" dist/install-server.sh

      # Proves that the files were built by this workflow from this tag, see
      # "Herkunft prüfen" in docs/installation.md.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/gymslunity-${{ github.ref_name }}.tar.gz
            dist/gymslunity-${{ github.ref_name }}.zip
            dist/install-server.sh

      # The same attestation as a file, so it can be checked without a
      # GitHub login (gh attestation verify --bundle).
      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/gymslunity-${GITHUB_REF_NAME}.sigstore.json"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Versions with a suffix such as -beta.1 are published as prereleases.
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/gymslunity-${GITHUB_REF_NAME}.tar.gz" \
            "dist/gymslunity-${GITHUB_REF_NAME}.tar.gz.sha256" \
            "dist/gymslunity-${GITHUB_REF_NAME}.zip" \
            "dist/gymslunity-${GITHUB_REF_NAME}.zip.sha256" \
            dist/install-server.sh \
            "dist/gymslunity-${GITHUB_REF_NAME}.sigstore.json" \
            --verify-tag \
            "${prerelease[@]}" \
            --title "GymSLunity ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Verify the published files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # As documented: download from the release and check the provenance,
          # online and with the attached bundle without a login.
          dir="$(mktemp -d)"
          bundle="gymslunity-${GITHUB_REF_NAME}.sigstore.json"
          gh release download "$GITHUB_REF_NAME" --dir "$dir" \
            --pattern "gymslunity-${GITHUB_REF_NAME}.tar.gz" \
            --pattern "gymslunity-${GITHUB_REF_NAME}.zip" \
            --pattern install-server.sh \
            --pattern "$bundle"
          for file in "gymslunity-${GITHUB_REF_NAME}.tar.gz" "gymslunity-${GITHUB_REF_NAME}.zip" install-server.sh; do
            verify=(gh attestation verify "$dir/$file" --repo "$GITHUB_REPOSITORY"
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
              --source-ref "refs/tags/$GITHUB_REF_NAME")
            "${verify[@]}"
            GH_TOKEN="" GH_CONFIG_DIR="$(mktemp -d)" "${verify[@]}" --bundle "$dir/$bundle"
          done

  # Public demo of the newest stable release; pre-releases (tags with a
  # suffix such as -beta.1) can be seen on "next" anyway.
  demo:
    needs: release
    if: vars.DEMO_DEPLOY == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # A dispatched run gets the secrets of the "demo" environment, a called
      # workflow does not. Unlike other events, workflow_dispatch also starts
      # a run when it is created with GITHUB_TOKEN.
      - name: Start demo deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run demo-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f target=release
